# Cloudflare Worker config for the handoff short-URL service.
#
# Before first deploy:
#   1. npm install
#   2. npx wrangler kv namespace create HANDOFFS
#      -> paste the printed id below (and into preview_id for `wrangler dev --remote`)
#   3. (optional) set your custom domain in [[routes]] below, then `npx wrangler deploy`
#
# Local dev (`npm run dev`) simulates KV locally and does NOT need a real id.

name = "handoff"
main = "src/index.js"
compatibility_date = "2026-05-01"
# nodejs_compat is required by the `agents` SDK (used for the /mcp Streamable HTTP transport).
compatibility_flags = ["nodejs_compat"]

# Strip the worker of the default *.workers.dev preview if you only want the custom domain:
workers_dev = true

[[kv_namespaces]]
binding = "HANDOFFS"
id = "ee072d67a4c34ed7bfb00bae244b4681"

# Feedback threads (replies on a capsule) live in D1; capsule bodies stay in KV.
# Apply schema before first deploy:
#   npx wrangler d1 execute handoff-db --local  --file=schema.sql
#   npx wrangler d1 execute handoff-db --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "handoff-db"
database_id = "8f553007-e8f2-4278-bd37-ac90c889a57b"

# --- Custom domain (set after choosing/registering one) -----------------------
# Once the domain's zone is on Cloudflare, uncomment and deploy:
# [[routes]]
# pattern = "ctxhop.dev"
# custom_domain = true

[observability]
enabled = true
